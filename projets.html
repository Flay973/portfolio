    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = getData();
            const projets = data.projets;

            // Build filters
            const categories = [...new Set(projets.map(p => p.categorie))];
            const catLabels = { dev: 'D\u00E9veloppement', reseau: 'R\u00E9seau', bdd: 'Base de donn\u00E9es', securite: 'S\u00E9curit\u00E9', autre: 'Autre' };
            
            let filterHTML = '<button class="filter-btn active" data-filter="all">Tous</button>';
            categories.forEach(cat => {
                filterHTML += `<button class="filter-btn" data-filter="${cat}">${catLabels[cat] || cat}</button>`;
            });
            document.getElementById('projectsFilter').innerHTML = filterHTML;

            // Build grid
            document.getElementById('projectsGrid').innerHTML = projets.map(p => `
                <div class="project-card" data-category="${p.categorie}">
                    <a href="projet-detail.html?id=${p.id}" class="project-card-link">
                        <div class="project-image">
                            <div class="project-placeholder">
                                <i class="fas ${p.icone}"></i>
                            </div>
                        </div>
                        <div class="project-info">
                            <div class="project-header">
                                <h3>${p.nom}</h3>
                                <span class="project-semester">${p.semestre}</span>
                            </div>
                            <p>${p.description}</p>
                            <div class="project-competences">
                                ${(p.competences || []).map(c => `<span class="competence-badge">${c}</span>`).join('')}
                            </div>
                            <div class="project-tech">
                                ${(p.technologies || []).map(t => `<span>${t}</span>`).join('')}
                            </div>
                            <span class="project-detail-link">Voir le d\u00E9tail <i class="fas fa-arrow-right"></i></span>
                        </div>
                    </a>
                </div>
            `).join('');

            // Init filter functionality
            const filterBtns = document.querySelectorAll('.filter-btn');
            const cards = document.querySelectorAll('.project-card');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const filter = btn.dataset.filter;
                    cards.forEach(card => {
                        if (filter === 'all' || card.dataset.category === filter) {
                            card.style.opacity = '1';
                            card.style.transform = 'scale(1)';
                            card.style.display = 'block';
                        } else {
                            card.style.opacity = '0';
                            card.style.transform = 'scale(0.95)';
                            setTimeout(() => card.style.display = 'none', 300);
                        }
                    });
                });
            });
        });
    </script>
    <script src="js/main.js"></script>
</body>
