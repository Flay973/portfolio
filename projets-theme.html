    <footer class="footer">

    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const themeId = params.get('theme');
            const data = getData();

            const themesInfo = {
                scolaire: { label: 'Scolaire', icon: 'fa-graduation-cap', tag: 'Formation', description: 'Projets r\u00E9alis\u00E9s dans le cadre de ma formation' },
                alternance: { label: 'Alternance', icon: 'fa-building', tag: 'Entreprise', description: 'Projets r\u00E9alis\u00E9s en entreprise' },
                stage: { label: 'Stage', icon: 'fa-briefcase', tag: 'Stage', description: 'Missions effectu\u00E9es lors de mes stages' }
            };

            const theme = themesInfo[themeId];
            if (!theme) {
                document.getElementById('projetsContent').innerHTML = '<div class="detail-not-found"><i class="fas fa-exclamation-triangle"></i><h2>Cat\u00E9gorie introuvable</h2><a href="projets.html" class="btn btn-primary">Retour aux projets</a></div>';
                return;
            }

            document.title = theme.label + ' | Projets | Flavio Athanase';
            document.getElementById('breadcrumbTheme').textContent = theme.label;
            document.getElementById('themeTag').textContent = theme.tag;
            document.getElementById('themeTitle').textContent = 'Projets ' + theme.label;

            const projets = data.projets.filter(p => p.theme === themeId);
            const container = document.getElementById('projetsContent');

            if (!projets.length) {
                container.innerHTML = '<div class="theme-empty" style="padding:60px 20px;"><i class="fas fa-folder-open"></i><p>Aucun projet dans cette cat\u00E9gorie pour le moment.</p></div>';
                return;
            }

            container.innerHTML = `<div class="projects-grid">${projets.map(p => {
                const compBadges = (p.competencesUtilisees || []).map(cu => {
                    const comp = getCompetenceById(data, cu.competenceId);
                    return comp ? '<span class="competence-badge" title="' + cu.niveau + '">' + comp.nom + '</span>' : '';
                }).join('');

                return `
                <div class="project-card">
                    <a href="projet-detail.html?id=${p.id}" class="project-card-link">
                        <div class="project-image">
                            <div class="project-placeholder"><i class="fas ${p.icone}"></i></div>
                        </div>
                        <div class="project-info">
                            <div class="project-header">
                                <h3>${p.nom}</h3>
                                <span class="project-semester">${p.semestre}</span>
                            </div>
                            <p>${p.description}</p>
                            <div class="project-competences">${compBadges}</div>
                            <div class="project-tech">
                                ${(p.technologies || []).map(t => '<span>' + t + '</span>').join('')}
                            </div>
                            <span class="project-detail-link">Voir le d\u00E9tail <i class="fas fa-arrow-right"></i></span>
                        </div>
                    </a>
                </div>`;
            }).join('')}</div>`;
        });
    </script>
    <script src="js/main.js"></script>
</body>
